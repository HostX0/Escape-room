name: Complete verified application source
on:
  push:
    branches: ['prepared/source']
    paths: ['.github/workflows/complete-source.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q Brotli==1.1.0 PyYAML==6.0.2
      - name: Restore individually verified source records
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import pathlib,yaml,json,hashlib,shutil
          document=yaml.safe_load(pathlib.Path('.github/workflows/export-source.yml').read_text())
          script=next(x['run'] for x in document['jobs']['export']['steps'] if x.get('name')=='Export verified recovered records without executing them')
          script=script.split("python - <<'PY'\n",1)[1].rsplit('\nPY',1)[0]
          exec(compile(script,'recover','exec'))
          files=json.loads(pathlib.Path('/tmp/recovered-files.json').read_text())['files']
          assert len(files)==66,'Require all 66 independently valid records'
          seen=set()
          for item in files:
              name=item['path'];p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and '\\' not in name and name not in seen
              assert not any(x in p.parts for x in ['.git','node_modules','storage','uploads','.private','.source-import','fonts'])
              assert not p.name.startswith('.env') or p.name=='.env.example'
              assert p.suffix.lower() in ['.js','.ts','.tsx','.css','.html','.json','.md','.sql','.yml','.svg']
              assert hashlib.sha256(item['content'].encode()).hexdigest()==item['sha256']
              seen.add(name)
          for item in files:
              p=pathlib.Path(item['path']);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(item['content'].encode())
          for folder in ['client','escape-room-backend']:
              p=pathlib.Path(folder)/'package-lock.json';lock=json.loads(p.read_text());package=json.loads((pathlib.Path(folder)/'package.json').read_text())
              for key in ['name','version','dependencies','devDependencies','engines']:
                  if key in package:lock['packages'][''][key]=package[key]
                  else:lock['packages'][''].pop(key,None)
              p.write_text(json.dumps(lock,indent=2)+'\n')
          shutil.rmtree('.source-import')
          print('COMPLETE_SOURCE_RECORDS_VERIFIED',len(seen))
          PY
      - name: Commit complete application
        run: |
          git config user.name 'Escape Room Source Import'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Restore complete Escape Room application, 66 verified source records'
          git push origin HEAD:prepared/source
