name: Export source for local repair
on:
  push:
    branches: ['prepared/source']
    paths: ['.github/workflows/export-source.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q Brotli==1.1.0 PyYAML==6.0.2
      - name: Export verified recovered records without executing them
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import pathlib,yaml,json,brotli,hashlib
          w=yaml.safe_load(pathlib.Path('.github/workflows/repair-import.yml').read_text())
          s=next(x['run'] for x in w['jobs']['import']['steps'] if x.get('name')=='Recover exact source bytes')
          s=s.split("python - <<'PY'\n",1)[1].rsplit('\nPY',1)[0]
          s=s.replace("exec(compile(script,'verified-import','exec'))", "pass")
          exec(compile(s,'prepare','exec'))
          scope={};exec(compile(script.split('assert len(raw)==96003')[0],'recover-transport','exec'),scope)
          pathlib.Path('/tmp/recovered-transport.br').write_bytes(scope['raw'])
          d=brotli.Decompressor();output=[];data=scope['raw']
          for i in range(0,len(data)):
              try: output.append(d.process(data[i:i+1]))
              except Exception as e: print('DECODE_STOP_OFFSET',i);break
          text=b''.join(output).decode('utf8',errors='ignore');pathlib.Path('/tmp/recovered-prefix.json').write_text(text)
          print('PREFIX_BYTES',len(text),'HEAD',text[:80])
          pos=text.index('[',text.index('"files"'))+1;parser=json.JSONDecoder();good=[]
          while pos<len(text):
              try:item,end=parser.raw_decode(text,pos)
              except json.JSONDecodeError:break
              if hashlib.sha256(item['content'].encode()).hexdigest()!=item['sha256']:
                  print('FIRST_BAD_RECORD',item['path']);break
              good.append(item);print('VERIFIED',item['path'])
              pos=end
              if pos>=len(text) or text[pos]!=',':break
              pos+=1
          pathlib.Path('/tmp/recovered-files.json').write_text(json.dumps({'files':good}))
          print('VERIFIED_COUNT',len(good))
          PY
      - name: Package repository
        run: |
          git archive -o /tmp/prepared-source.zip HEAD
          mkdir export
          cp /tmp/prepared-source.zip /tmp/recovered-transport.br /tmp/recovered-prefix.json /tmp/recovered-files.json export/
      - uses: actions/upload-artifact@v4
        with:
          name: source-repair-input
          path: export/
          retention-days: 3
