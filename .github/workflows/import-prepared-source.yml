name: Complete reviewed source import
on:
  push:
    branches: ['prepared/source']
    paths: ['.github/workflows/import-prepared-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/prepared/source'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prepared/source
      - run: python -m pip install --disable-pip-version-check Brotli==1.1.0
      - name: Verify and import reviewed application files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,shutil,urllib.request,brotli
          def blob(sha):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GH_REPO']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response: obj=json.load(response)
              raw=base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              return raw
          hashes=['1a4caec516250b279f9c856ee8a80ea885e82bafa2c6619d194c29004b2ab583','99175dbd90990ea6fc80f462afda3b348922162025097a6ea39013f51eeadb9a','624bbde8b5241e7d2b81398301c59f63765b304466ad54214da6dbad7941eafe','099aca25a753e9fd830e18a7dc3bd18cafcdebc4bc11956c8720bcdf9c621211','b611bdd045e26706d8ade52a5fd16cf4e02e9b27a64998c6e4259fb1cfe7370c','27a3490b45a43e2af4829437e7528971cc9d68cd2d9974a28cda822ffe22d6d8','27ed87a1370306ae52643ae0ec0e786dc2d1a4593970b0843c4c626268c56e76','187627f9065120fa692951f546357e7eb67f5900aab311013ff36cbb22d8a057','32d73beaaab8a4b0f293f86c88f302e0b2da1f2a1de3c7d041e4b1d43aec83b6','62bf3db6bac93e22eb11b234fa81ed610789fefacba506b092fc186985c0e29a','61986efdcd9c1420270f39f0822cf2241896d78f4f2bc3d83a73c124fb85da6f','0f30ce1bb3d87081219505c01910fa754e47eb1f5173d4caee6fafe745aa965c','b64e16e8fad7c7472a878db9a9f6d7e360ecac76967692c3000a30824951325a','c4f76143340b86bcc7a1dd2632c4d10b0460631c5e1f478882e28a028fc9eb1d','40d2a213711b03b18113ff1c12434fefbe42c013077b708ec5dce91dc8f2991e','5e141195aa76fd7789c2f2b6ade58bc27d8418700fe5df3a5a25e3b90e11d51d']
          text=base64.b64encode(blob('794a116f896f3297638452d94de01de105b728fd')).decode()
          assert len(text)==16000, 'Unexpected transferred chunk length'
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          blocks=[]; failures=[]
          for index,expected in enumerate(hashes):
              block=text[index*1024:(index+1)*1024]
              if hashlib.sha256(block.encode()).hexdigest()!=expected:
                  fixed=None
                  for position in range(len(block)):
                      for char in alphabet:
                          candidate=block[:position]+char+block[position+1:]
                          if hashlib.sha256(candidate.encode()).hexdigest()==expected:
                              fixed=candidate;print('Corrected transfer character at offset',index*1024+position);break
                      if fixed is not None:break
                  if fixed is None:
                      print('MISMATCH_BLOCK',index,block);failures.append(index)
                  else:block=fixed
              blocks.append(block)
          assert not failures, 'Unresolved transfer mismatch; no source files were written'
          part7=base64.b64decode(''.join(blocks),validate=True)
          assert hashlib.sha1(b'blob '+str(len(part7)).encode()+b'\0'+part7).hexdigest()=='218b394ef9e8792d04409cb833a921387a49f2ac'
          parts=[pathlib.Path('.source-import/part-%02d.br'%i).read_bytes() for i in range(6)]
          parts.extend([blob('e82de9eb341264bd084570c4f33807b0b2620d73'),part7,base64.b64decode('KKRr')])
          raw=b''.join(parts)
          assert len(raw)==96003
          assert hashlib.sha256(raw).hexdigest()=='f4bf9f7a52ac0cdd321e65a26a25d157382c9c74d7111e7645cca41e9ee20cc9'
          source=json.loads(brotli.decompress(raw))
          assert source['format']=='escape-room-text-source-v2' and len(source['files'])==66
          seen=set()
          for item in source['files']:
              name=item['path'];p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and '\\' not in name and name not in seen
              assert not any(x in p.parts for x in ['.git','node_modules','storage','uploads','.private','.source-import','fonts'])
              assert not p.name.startswith('.env') or p.name=='.env.example'
              assert p.suffix.lower() in ['.js','.ts','.tsx','.css','.html','.json','.md','.sql','.yml']
              assert hashlib.sha256(item['content'].encode('utf8')).hexdigest()==item['sha256']
              seen.add(name)
          for item in source['files']:
              p=pathlib.Path(item['path']);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(item['content'].encode('utf8'))
              print('Imported',item['path'],item['sha256'])
          # Synchronize root lock metadata, retaining every resolved dependency and integrity hash.
          p=pathlib.Path('client/package-lock.json');lock=json.loads(p.read_text());package=json.loads(pathlib.Path('client/package.json').read_text())
          for key in ['name','version','dependencies','devDependencies','engines']:
              if key in package:lock['packages'][''][key]=package[key]
              else:lock['packages'][''].pop(key,None)
          p.write_text(json.dumps(lock,indent=2)+'\n')
          shutil.rmtree('.source-import')
          print('SOURCE_IMPORT_VERIFIED',len(seen))
          PY
      - name: Commit complete reviewed source
        run: |
          git config user.name 'Escape Room Source Import'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Complete checksum-verified Escape Room application source'
          git push origin HEAD:prepared/source
