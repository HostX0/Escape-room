name: Inspect interrupted source upload
on:
  push:
    paths: ['.github/workflows/recover-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Install archive decoder
        run: python -m pip install --disable-pip-version-check Brotli==1.1.0
      - name: Read and inspect existing uploaded objects
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request, brotli
          hashes = ['ead5244dbb1097187b98d53a9b174e69d26316d8','7cccaf1e57f34093e8a5b899be6c16e2fe141bb6','92b77b3c464cf1690bf82de269b2608464630bd9','81bc72d8e2b8c7245fff359cfbfc665eded9838b','9ecc8c8fcd8d45ffbf466069f0d60b4d89dcdbfe','007083f1dc3fc31c5c2a2681910d6dacb575746b','e77a9df6a5af52c543c9af37ddac46f268bbfc0c','27a041cab20d468ba6f070f458951fdc14759ca4','5c722405f332de4ed9a5d9fa9882ec2ea5c41f2f','e54c8f4cd6b9e923722c40e269145ddad1b4c7d0','2fd7c4c578a21acc346cd7f00892495e2ab51cce']
          parts=[]
          for sha in hashes:
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GH_REPO']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response: obj=json.load(response)
              raw=base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              parts.append(raw.strip())
          data=base64.b64decode(b''.join(parts),validate=True)
          decoder=brotli.Decompressor(); output=[]
          for i in range(0,len(data),1024):
              try: output.append(decoder.process(data[i:i+1024]))
              except brotli.error: print('ARCHIVE_PARTIAL_OR_CORRUPT_AT',i); break
          text=b''.join(output).decode('utf-8',errors='ignore')
          assert text.startswith('{"format":"escape-room-source-v1","files":[')
          position=text.index('[',text.index('"files"'))+1
          parser=json.JSONDecoder(); count=0
          while position<len(text):
              try: item,end=parser.raw_decode(text,position)
              except json.JSONDecodeError: break
              raw=item['content'].encode('utf-8') if item['encoding']=='utf8' else base64.b64decode(item['content'])
              actual=hashlib.sha256(raw).hexdigest()
              assert actual==item['sha256'], 'Invalid file checksum'
              print(json.dumps({'path':item['path'],'sha256':actual,'bytes':len(raw)},ensure_ascii=True))
              count+=1;position=end
              if position>=len(text) or text[position]!=',': break
              position+=1
          print('COMPLETE_RECORDS',count,'BROTLI_FINISHED',decoder.is_finished(),'COMPRESSED_BYTES',len(data),'DECODED_BYTES',len(text.encode()))
          PY
