name: Repair and complete source import
on:
  push:
    branches: ['prepared/source']
    paths: ['.github/workflows/repair-import.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prepared/source
      - run: python -m pip install --disable-pip-version-check Brotli==1.1.0 PyYAML==6.0.2
      - name: Recover exact source bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import pathlib,yaml
          document=yaml.safe_load(pathlib.Path('.github/workflows/import-prepared-source.yml').read_text())
          script=next(s['run'] for s in document['jobs']['import']['steps'] if s.get('name')=='Verify and import reviewed application files')
          script=script.split("python - <<'PY'\n",1)[1].rsplit('\nPY',1)[0]
          start=script.index('blocks=[]; failures=[]')
          end=script.index("part7=base64.b64decode",start)
          repair='''blocks=[]; offset=0
          for index,expected in enumerate(hashes):
              length=1024 if index<15 else 640
              segment=text[offset:offset+length+1]
              block=segment[:length]
              check=lambda s: len(s)==length and hashlib.sha256(s.encode()).hexdigest()==expected
              fixed=block if check(block) else None; consumed=length
              if fixed is None:
                  for p in range(length):
                      for c in alphabet:
                          candidate=block[:p]+c+block[p+1:]
                          if check(candidate): fixed=candidate; break
                      if fixed is not None: break
              if fixed is None:
                  for p in range(length):
                      for c in alphabet:
                          candidate=(segment[:p]+c+segment[p:])[:length]
                          if check(candidate): fixed=candidate; consumed=length-1; break
                      if fixed is not None: break
              if fixed is None:
                  for p in range(len(segment)):
                      candidate=(segment[:p]+segment[p+1:])[:length]
                      if check(candidate): fixed=candidate; consumed=length+1; break
              if fixed is None:
                  for p in range(length-1):
                      candidate=block[:p]+block[p+1]+block[p]+block[p+2:]
                      if check(candidate): fixed=candidate; break
              if fixed is None:
                  for p in range(length-1):
                      for a in alphabet:
                          for b in alphabet:
                              candidate=block[:p]+a+b+block[p+2:]
                              if check(candidate): fixed=candidate; break
                          if fixed is not None: break
                      if fixed is not None: break
              assert fixed is not None, 'Transport mismatch in block '+str(index)
              blocks.append(fixed); offset+=consumed
              print('Verified transport block',index,'consumed',consumed)
          '''
          script=script[:start]+repair+script[end:]
          exec(compile(script,'verified-import','exec'))
          PY
      - name: Commit complete source
        run: |
          git config user.name 'Escape Room Source Import'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Complete exact-checksum Escape Room source import'
          git push origin HEAD:prepared/source
      - name: Package source for validation
        run: git archive -o escape-room-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: escape-room-source
          path: escape-room-source.zip
          retention-days: 3
