name: Restore verified source assets
on:
  push:
    branches: ['prepared/source']
    paths: ['.github/workflows/restore-verified-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    if: github.ref == 'refs/heads/prepared/source'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prepared/source
      - run: python -m pip install --disable-pip-version-check Brotli==1.1.0
      - name: Recover allowlisted files with exact SHA256 verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request,brotli
          hashes=['ead5244dbb1097187b98d53a9b174e69d26316d8','7cccaf1e57f34093e8a5b899be6c16e2fe141bb6','92b77b3c464cf1690bf82de269b2608464630bd9','81bc72d8e2b8c7245fff359cfbfc665eded9838b','9ecc8c8fcd8d45ffbf466069f0d60b4d89dcdbfe','007083f1dc3fc31c5c2a2681910d6dacb575746b','e77a9df6a5af52c543c9af37ddac46f268bbfc0c','27a041cab20d468ba6f070f458951fdc14759ca4','5c722405f332de4ed9a5d9fa9882ec2ea5c41f2f','e54c8f4cd6b9e923722c40e269145ddad1b4c7d0','2fd7c4c578a21acc346cd7f00892495e2ab51cce']
          allowed={'client/package-lock.json':'e0344e2099491821891f136afe90878ecb4b752d7d9dda4ec451a68d7e9486f1','client/.gitignore':'fe718e7babb14f3cbad2d97f08889b9ce5215ed3fe0e43b2b8cfbfb3b9b844e8','client/eslint.config.js':'4efe97b16d1200fac0eaf07aa00930a8668b1f96a0be1891ace8c1e712ff0ccb','client/postcss.config.js':'190c877db466995bf1482f4a16abd06e04a89ede3119341e2a86ff96e1737b27','client/public/logo.webp':'87f858c07a6e5c217e7f69c81089170c711ac530c12192341c72b6fb8c8dc837'}
          parts=[]
          for sha in hashes:
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GH_REPO']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response: obj=json.load(response)
              raw=base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              parts.append(raw.strip())
          decoder=brotli.Decompressor(); output=[]; data=base64.b64decode(b''.join(parts),validate=True)
          for i in range(0,len(data),1024): output.append(decoder.process(data[i:i+1024]))
          text=b''.join(output).decode('utf8',errors='ignore')
          assert text.startswith('{"format":"escape-room-source-v1","files":[')
          position=text.index('[',text.index('"files"'))+1; parser=json.JSONDecoder(); restored=set()
          while position<len(text):
              try: item,end=parser.raw_decode(text,position)
              except json.JSONDecodeError: break
              name=item['path']
              if name in allowed:
                  raw=item['content'].encode('utf8') if item['encoding']=='utf8' else base64.b64decode(item['content'])
                  assert hashlib.sha256(raw).hexdigest()==allowed[name]
                  destination=pathlib.Path(name); destination.parent.mkdir(parents=True,exist_ok=True); destination.write_bytes(raw)
                  restored.add(name); print('Verified',name,len(raw))
                  if name.endswith('package-lock.json'):
                      lock=json.loads(raw); print('Lock root metadata:',json.dumps(lock['packages']['']))
                  if name=='client/public/logo.webp':
                      destination=pathlib.Path('client/src/assets/logo.webp');destination.parent.mkdir(parents=True,exist_ok=True);destination.write_bytes(raw)
              position=end
              if position>=len(text) or text[position]!=',': break
              position+=1
          assert restored==set(allowed),'Missing an allowlisted file'
          PY
      - name: Commit verified assets to the preparation branch
        run: |
          git config user.name 'Escape Room Source Import'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/package-lock.json client/.gitignore client/eslint.config.js client/postcss.config.js client/public/logo.webp client/src/assets/logo.webp
          git diff --cached --quiet || git commit -m 'Restore checksum-verified public logo and client lockfile'
          git push origin HEAD:prepared/source
