name: Verify recovered source checksums
on:
  push:
    branches: ['prepared/source']
    paths: ['.github/workflows/verify-import.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q Brotli==1.1.0 PyYAML==6.0.2
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import pathlib,yaml
          w=yaml.safe_load(pathlib.Path('.github/workflows/repair-import.yml').read_text())
          s=next(x['run'] for x in w['jobs']['import']['steps'] if x.get('name')=='Recover exact source bytes')
          s=s.split("python - <<'PY'\n",1)[1].rsplit('\nPY',1)[0]
          s=s.replace("exec(compile(script,'verified-import','exec'))", "pathlib.Path('/tmp/import.py').write_text(script)")
          exec(compile(s,'prepare','exec'))
          for i,line in enumerate(script.splitlines(),1):
              if 'assert' in line: print('CHECK',i,line)
          scope={}
          try: exec(compile(script,'import','exec'),scope)
          except Exception as error:
              import hashlib,brotli,json
              print('FAILED',repr(error))
              for k in ['part7','raw']:
                  if k in scope: print(k,len(scope[k]),'sha256',hashlib.sha256(scope[k]).hexdigest(),'blob',hashlib.sha1(b'blob '+str(len(scope[k])).encode()+b'\0'+scope[k]).hexdigest())
              if 'raw' in scope:
                  try:
                      data=json.loads(brotli.decompress(scope['raw']))
                      print('decoded',data.get('format'),len(data.get('files',[])))
                      for item in data.get('files',[]):
                          print('FILE_CHECK',item['path'],hashlib.sha256(item['content'].encode()).hexdigest()==item['sha256'])
                  except Exception as de: print('DECODE_ERROR',repr(de))
              raise
          PY
